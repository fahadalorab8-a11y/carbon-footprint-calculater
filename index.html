<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carbon Footprint Calculator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container-fluid page-wrap">
    <h1 class="page-title">Carbon Footprint Calculator</h1>

    <nav class="navbar navbar-expand navbar-light nav-frame" aria-label="Main navigation">
      <div class="container-fluid p-0">
        <div class="navbar-nav flex-row flex-wrap">
          <a class="nav-link active" href="#">General</a>
          <a class="nav-link" href="#">Home</a>
          <a class="nav-link" href="#">Travel</a>
          <a class="nav-link" href="#">Food</a>
          <a class="nav-link" href="#">Electronic usage</a>
          <a class="nav-link" href="#">Shopping</a>
          <a class="nav-link" href="#">Result</a>
        </div>
        <a class="btn btn-success home-button" href="#">Home</a>
      </div>
    </nav>

    <section class="card calculator-card" aria-labelledby="form-title">
      <div class="card-header" id="form-title">Fill the form below</div>
      <div class="card-body">
        <form id="calculatorForm">
          <div class="row g-2 align-items-center form-row">
            <label for="name" class="col-4 col-form-label">Name</label>
            <div class="col-8"><input id="name" name="name" class="form-control" type="text" autocomplete="name"></div>
          </div>
          <div class="row g-2 align-items-center form-row">
            <label for="age" class="col-4 col-form-label">Age</label>
            <div class="col-8"><input id="age" name="age" class="form-control" type="number" min="1" max="120"></div>
          </div>
          <div class="row g-2 align-items-center form-row">
            <label for="country" class="col-4 col-form-label">Country</label>
            <div class="col-8">
              <select id="country" name="country" class="form-select">
                <option>Saudi Arabia</option>
                <option>United Arab Emirates</option>
                <option>Qatar</option>
                <option>Kuwait</option>
                <option>Bahrain</option>
                <option>Oman</option>
                <option>Other</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="card-footer d-flex justify-content-center gap-2">
        <a href="#" class="btn btn-success btn-sm" id="prevButton">Prev</a>
        <a href="#" class="btn btn-success btn-sm" id="nextButton">Next</a>
      </div>
    </section>
  </main>
  <script>
    document.getElementById('prevButton').addEventListener('click', function (event) {
      event.preventDefault();
      document.getElementById('name').focus();
    });
    document.getElementById('nextButton').addEventListener('click', function (event) {
      event.preventDefault();
      const name = document.getElementById('name').value.trim();
      const age = document.getElementById('age').value;
      if (!name || !age) {
        alert('Please enter your name and age first.');
        return;
      }
      alert('Thanks, ' + name + '! Your details have been entered.');
    });
  </script>
</body>
</html>
